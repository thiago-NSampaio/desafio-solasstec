version: '3.8'

services:
  postgres:
    container_name: solasstec-pg
    image: bitnami/postgresql:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_USERNAME: postgres
      POSTGRESQL_PASSWORD: docker
      POSTGRESQL_DATABASE: solasstec
    volumes:
      - postgres_data:/bitnami/postgresql

volumes:
  postgres_data: